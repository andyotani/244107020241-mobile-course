unit: push-messaging
side_effects:
  - source_loc: "lib/messaging/push_service.dart:46"
    effect: "Background handler ensures plugin registration, initializes Firebase, and persists notification payloads through NotificationStore.add."
    must_preserve: true
  - source_loc: "lib/messaging/push_service.dart:79"
    effect: "Requests alert, badge and sound permission; authorization and provisional statuses count as authorized."
    must_preserve: true
  - source_loc: "lib/messaging/push_service.dart:194"
    effect: "Enables FCM auto-init, attempts token retrieval with a 30-second timeout, logs a token prefix, and listens for token refresh without persisting the FCM token."
    must_preserve: true
  - source_loc: "lib/messaging/push_service.dart:254"
    effect: "Subscribes to pengumuman-kampus during push initialization."
    must_preserve: true
  - source_loc: "lib/messaging/push_service.dart:261"
    effect: "For foreground messages, calls the app callback then shows a local notification; local display is skipped if notification payload is absent."
    must_preserve: true
  - source_loc: "lib/messaging/push_service.dart:120"
    effect: "Initializes a local notification plugin with an Android high-importance sound/vibration channel and click payload callback."
    must_preserve: true
branches:
  - source_loc: "lib/messaging/push_service.dart:60"
    condition: "Background RemoteMessage has a notification payload."
    behavior: "Persist title/body with route from data; use messageId or sentTime/current-time fallback for id. Messages without notification payload are not persisted by this handler."
    must_preserve: true
  - source_loc: "lib/messaging/push_service.dart:151"
    condition: "Foreground RemoteMessage has no notification payload."
    behavior: "Do not display a local notification; app callback also returns without adding to inbox."
    must_preserve: true
  - source_loc: "lib/messaging/push_service.dart:280"
    condition: "App was terminated and Firebase returns a non-null initial message."
    behavior: "Pass its data.route to the notification-tap callback."
    must_preserve: true
error_paths:
  - source_loc: "lib/messaging/push_service.dart:225"
    trigger: "FCM token acquisition, listener setup, or timeout fails."
    outcome: "Catch and log error plus stack; initialization continues if this helper catches internally."
    contract: "No FCM token is written to secure storage."
    must_preserve: true
  - source_loc: "lib/main.dart:216"
    trigger: "Push-service initialization fails."
    outcome: "Application logs the push initialization error and stack; root app remains running."
    contract: "Push failure does not replace the primary app screen with the Firebase startup error screen."
    must_preserve: true
concurrency:
  model: event-loop
  tx_boundary:
    source_loc: "lib/messaging/push_service.dart:46"
    scope: "Background persistence and foreground event callbacks execute asynchronously; no transaction/serialization lock exists across concurrent notifications."
    isolation: "not specified"
    must_preserve: true
