unit: app-shell
side_effects:
  - source_loc: "lib/main.dart:94"
    effect: "Ensures Flutter bindings, initializes Firebase with current-platform options, registers the FCM background handler, then runs the app."
    must_preserve: true
  - source_loc: "lib/main.dart:106"
    effect: "Registers firebaseMessagingBackgroundHandler with Firebase Messaging before runApp."
    must_preserve: true
  - source_loc: "lib/main.dart:168"
    effect: "Initializes push service once after the first frame; on foreground notification payload, appends the notification through notificationProvider."
    must_preserve: true
branches:
  - source_loc: "lib/main.dart:31"
    condition: "Authentication provider is loading during route redirect."
    behavior: "Allow the current route without redirect until auth restoration resolves."
    must_preserve: true
  - source_loc: "lib/main.dart:40"
    condition: "Auth resolves false and current route is not /login."
    behavior: "Redirect to /login."
    must_preserve: true
  - source_loc: "lib/main.dart:44"
    condition: "Auth resolves true while current route is /login."
    behavior: "Redirect to /."
    must_preserve: true
  - source_loc: "lib/main.dart:206"
    condition: "A notification click route equals /."
    behavior: "Navigate to home; every other click route navigates to /notifications."
    must_preserve: true
error_paths:
  - source_loc: "lib/main.dart:99"
    trigger: "Firebase initialization or app bootstrap throws."
    outcome: "Log error and stack trace, then render a startup failure screen containing the error."
    contract: "Do not run the regular routed app in the catch branch."
    must_preserve: true
concurrency:
  model: event-loop
  tx_boundary:
    source_loc: "lib/main.dart:94"
    scope: "Firebase initialization completes before the root ProviderScope app is launched; no database transaction exists."
    isolation: "not applicable"
    must_preserve: true
