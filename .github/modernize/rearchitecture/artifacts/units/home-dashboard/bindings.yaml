unit: home-dashboard
bindings:
  - type: route-declaration
    name: "GoRouter / route"
    source_loc: "lib/main.dart:61"
    target: "HomePage"
    must_appear_in_target: true
    notes: "Route guard makes this available to authenticated sessions."
  - type: di-registration
    name: "authStateProvider and notificationProvider"
    source_loc: "lib/pages/home_page.dart:4"
    target: "logout action and unread badge"
    must_appear_in_target: true
    notes: "Preserve existing provider-driven status and actions."
runtime_config: []
