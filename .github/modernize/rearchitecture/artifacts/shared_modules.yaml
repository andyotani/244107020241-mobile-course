modules:
  - name: auth-state-provider
    kind: store
    source_loc: "lib/providers/auth_provider.dart:25"
    used_by_units: [app-shell, login-authentication, home-dashboard]
    fields:
      - name: authStateProvider
        type: "AsyncNotifierProvider<AuthNotifier, bool>"
      - name: AuthNotifier.build
        type: "Future<bool>; reads access_token from TokenStore"
      - name: AuthNotifier.login
        type: "Future<void>; establishes session and persists access/refresh tokens"
      - name: AuthNotifier.logout
        type: "Future<void>; clears persisted tokens and emits false"
    god_class: false
    split_candidate: false
    migration_strategy: wrap
    notes: "A single auth state provider is consumed by the router, login screen, and home logout action."

  - name: notification-state-provider
