unit: app-shell
bindings:
  - type: di-registration
    name: "ProviderScope"
    source_loc: "lib/main.dart:116"
    target: "CampusNotifApp"
    must_appear_in_target: true
    notes: "Riverpod providers are available under the application root."
  - type: route-declaration
    name: "GoRouter route table: /login, /, /notifications"
    source_loc: "lib/main.dart:24"
    target: "LoginPage, HomePage, NotificationPage"
    must_appear_in_target: true
    notes: "Initial path is /; redirect reads authStateProvider, waits while loading, and refreshes on auth changes."
  - type: listener
    name: "Firebase initialization and background handler registration"
    source_loc: "lib/main.dart:94"
    target: "Firebase.initializeApp and firebaseMessagingBackgroundHandler"
    must_appear_in_target: true
    notes: "Bootstrap uses generated platform options before runApp."
  - type: listener
    name: "Post-frame push initialization"
    source_loc: "lib/main.dart:153"
    target: "initializePushService"
    must_appear_in_target: true
    notes: "Foreground callback persists notification data; click callback routes to home only for '/' and otherwise to inbox."
runtime_config: []
