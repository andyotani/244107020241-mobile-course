flows:
  - name: "Push-delivered notifications persisted for the inbox"
    medium: file
    key: "SharedPreferences: campus_notifications"
    writer:
      unit: push-messaging
      source_loc: "lib/messaging/push_service.dart:46"
    reader:
      unit: notification-inbox
      source_loc: "lib/data/notification_store.dart:74"
    pairing: matched
    must_preserve: true
    must_confirm: null
    verification_hint: "Deliver a foreground notification and a background notification, then verify the inbox loads each once, newest-first, and preserves its fields after app restart."
    notes: "The background handler and foreground callback both write through NotificationStore.add; the inbox loads/removes the same JSON list from SharedPreferences. This is a key/value plugin-backed store, classified here under the available persistent-file medium."
