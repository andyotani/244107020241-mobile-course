        type: "Future<void>; persists and refreshes the list"
      - name: NotificationNotifier.markAsRead
        type: "Future<void>; removes the selected notification"
      - name: NotificationNotifier.deleteNotification
        type: "Future<void>; removes the selected notification"
      - name: NotificationNotifier.clearAll
        type: "Future<void>; clears persistent storage and emits an empty list"
      - name: NotificationNotifier.unreadCount
        type: "int; count of items whose isRead is false"
    god_class: false
    split_candidate: false
    migration_strategy: wrap
    notes: "The app shell invokes addNotification for foreground FCM; home reads unread state; the inbox handles user actions."

