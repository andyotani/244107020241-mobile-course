unit: notification-inbox
bindings:
  - type: route-declaration
    name: "GoRouter /notifications route"
    source_loc: "lib/main.dart:69"
    target: "NotificationPage"
    must_appear_in_target: true
    notes: "Home and notification clicks navigate here."
  - type: di-registration
    name: "notificationProvider and notificationStoreProvider"
    source_loc: "lib/providers/notification_provider.dart:8"
    target: "NotificationNotifier"
    must_appear_in_target: true
    notes: "AsyncNotifier loads on build and refreshes state after operations."
runtime_config:
  - key: "campus_notifications"
    source_loc: "lib/data/notification_store.dart:69"
    source: code
    default_value: "missing or empty value -> empty list"
    must_appear_in_target: true
    notes: "SharedPreferences string containing a JSON array of AppNotification records."
